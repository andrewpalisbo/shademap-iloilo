
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShadeMap Iloilo</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  >

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #e5e5e5;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: white;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 1px 5px #999;
      max-width: 80%;
    }

    .map-popup {
      font-family: Arial, sans-serif;
      min-width: 150px;
    }

    .map-popup button {
      background: #28734d;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="status">Loading ShadeMap Iloilo...</div>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
window.addEventListener('load', function () {

  const status = document.getElementById('status');

  if (typeof maplibregl === 'undefined') {
    status.textContent = 'Error: MapLibre library failed to load.';
    return;
  }

  // LOCATION DATA
  const places = [
    {
      id: 'loc01',
      name: 'Westwoods Subdivision Clubhouse',
      lng: 122.5366716,
      lat: 10.7307004,
      score: 80
    },
    {
      id: 'loc02',
      name: 'Westwoods Subdivision Park / Playground',
      lng: 122.5368513,
      lat: 10.7303288,
      score: 55
    },
    {
      id: 'loc03',
      name: 'Westwoods Subdivision Tennis Court',
      lng: 122.5364520,
      lat: 10.7303917,
      score: 10
    }
  ];

  // CREATE MAP
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/bright',
    center: [122.53665, 10.73050],
    zoom: 17,
    pitch: 60,
    bearing: -15,
    maxPitch: 85
  });

  // MAP CONTROLS
  map.addControl(
    new maplibregl.NavigationControl({
      visualizePitch: true
    }),
    'top-right'
  );

  map.addControl(
    new maplibregl.ScaleControl(),
    'bottom-left'
  );

  // REPORT MAP ERRORS
  map.on('error', function (event) {
    console.error('Map error:', event.error);
    status.textContent =
      'Map resource error. Check internet connection or map data.';
  });

  // MAP LOADED
  map.on('load', function () {

    status.textContent = 'ShadeMap Iloilo loaded';

    // ADD 3D BUILDINGS
    try {

      map.addSource('openfreemap-buildings', {
        type: 'vector',
        url: 'https://tiles.openfreemap.org/planet'
      });

      const layers = map.getStyle().layers;

      let labelLayerId;

      for (let i = 0; i < layers.length; i++) {
        if (
          layers[i].type === 'symbol' &&
          layers[i].layout &&
          layers[i].layout['text-field']
        ) {
          labelLayerId = layers[i].id;
          break;
        }
      }

      const buildingLayer = {
        id: '3d-buildings',
        source: 'openfreemap-buildings',
        'source-layer': 'building',
        type: 'fill-extrusion',
        minzoom: 14,

        paint: {
          'fill-extrusion-color': '#aab5aa',

          'fill-extrusion-height': [
            'coalesce',
            ['get', 'render_height'],
            0
          ],

          'fill-extrusion-base': [
            'coalesce',
            ['get', 'render_min_height'],
            0
          ],

          'fill-extrusion-opacity': 0.85
        }
      };

      if (labelLayerId) {
        map.addLayer(buildingLayer, labelLayerId);
      } else {
        map.addLayer(buildingLayer);
      }

    } catch (error) {
      console.error('3D building error:', error);
      status.textContent = 'Map loaded; 3D buildings unavailable.';
    }

    // ADD LOCATION MARKERS
    places.forEach(function (place) {

      const popup = new maplibregl.Popup({
        offset: 25
      }).setHTML(
        '<div class="map-popup">' +
          '<b>' + place.name + '</b>' +
          '<br><br>' +
          'Amenity Score: ' + place.score + '/100' +
          '<br>' +
          '<button id="open-' + place.id + '">' +
            'View Details' +
          '</button>' +
        '</div>'
      );

      // SEND LOCATION ID TO MIT APP INVENTOR
      popup.on('open', function () {

        const button = popup.getElement().querySelector(
          '#open-' + place.id
        );

        if (button) {
          button.addEventListener('click', function () {

            if (window.AppInventor) {
              window.AppInventor.setWebViewString(
                'LOC|' + place.id
              );
            } else {
              alert('MIT App Inventor connection is not available.');
            }

          });
        }

      });

      new maplibregl.Marker({
        color: '#28734d'
      })
        .setLngLat([place.lng, place.lat])
        .setPopup(popup)
        .addTo(map);

    });

  });

});
</script>

</body>
</html>
