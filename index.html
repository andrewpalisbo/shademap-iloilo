
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ShadeMap Iloilo</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  >

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #e5e5e5;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      background: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 1px 5px #999;
    }

    .map-popup {
      font-family: Arial, sans-serif;
      min-width: 150px;
    }

    .map-popup button {
      background: #28734d;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="status">Loading map...</div>
<div id="map"></div>

<script
  src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
  onerror="document.getElementById('status').textContent='ERROR: MapLibre library could not load.'">
</script>

<script>
window.addEventListener('load', function () {

  const status = document.getElementById('status');

  if (typeof maplibregl === 'undefined') {
    status.textContent = 'ERROR: MapLibre library is unavailable.';
    return;
  }

  const places = [
    {
      id: 'loc01',
      name: 'Westwoods Subdivision Clubhouse',
      lng: 122.5366716,
      lat: 10.7307004,
      score: 80
    },
    {
      id: 'loc02',
      name: 'Westwoods Subdivision Park / Playground',
      lng: 122.5368513,
      lat: 10.7303288,
      score: 55
    },
    {
      id: 'loc03',
      name: 'Westwoods Subdivision Tennis Court',
      lng: 122.5364520,
      lat: 10.7303917,
      score: 10
    }
  ];

  try {

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [122.53665, 10.73050],
      zoom: 16,
      pitch: 45,
      bearing: -15
    });

    map.addControl(
      new maplibregl.NavigationControl(),
      'top-right'
    );

    map.on('error', function (event) {
      console.error('Map error:', event.error);

      status.textContent =
        'Map loading error. Check your internet connection or map service.';
    });

    map.on('load', function () {

      status.textContent = 'Map loaded successfully.';

      places.forEach(function (place) {

        const popup = new maplibregl.Popup({
          offset: 25
        }).setHTML(
          '<div class="map-popup">' +
            '<b>' + place.name + '</b>' +
            '<br><br>' +
            'Amenity Score: ' + place.score + '/100' +
            '<br>' +
            '<button id="open-' + place.id + '">' +
              'View Details' +
            '</button>' +
          '</div>'
        );

        popup.on('open', function () {

          const button = popup.getElement().querySelector(
            '#open-' + place.id
          );

          if (button) {
            button.addEventListener('click', function () {

              if (window.AppInventor) {
                window.AppInventor.setWebViewString(
                  'LOC|' + place.id
                );
              } else {
                alert('MIT App Inventor connection is not available.');
              }

            });
          }

        });

        new maplibregl.Marker({
          color: '#28734d'
        })
          .setLngLat([place.lng, place.lat])
          .setPopup(popup)
          .addTo(map);

      });

    });

  } catch (error) {

    console.error(error);
    status.textContent = 'ERROR: ' + error.message;

  }

});
</script>

</body>
</html>
